name: Auto-update SmartTube (Persian subtitles patch)

# Mirrors update-smarttube.sh: find the latest yuliskov/SmartTube release, cherry-pick
# the Persian-subtitle patch (commit 16f849e) onto it, build, and publish the APK as
# a GitHub Release -- so there's always a stable "latest" download link. Does NOT
# install anything on any device; that part stays manual (adb install from the link).

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild+republish even if this tag was already released'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find latest upstream release
        id: upstream
        run: |
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          TAG=$(git ls-remote --tags --refs upstream \
                | sed 's#.*refs/tags/##' \
                | grep -E '^[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n \
                | tail -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest upstream release: $TAG"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" != "true" ] && gh release view "persian-subs-$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "persian-subs-$TAG already released -- nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the patched branch (reuse if it already exists, else create it)
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          git config user.email "actions@github.com"
          git config user.name "SmartTube auto-update"
          if git ls-remote --exit-code --heads origin "persian-subs-$TAG" >/dev/null 2>&1; then
            echo "persian-subs-$TAG already exists on origin (likely hand-resolved after a conflict) -- using it as-is"
            # explicit refs/heads fetch + checkout -B origin/<branch>: the release step below
            # creates a TAG with this exact same name, and a plain "git checkout persian-subs-$TAG"
            # resolves that ambiguously (picked the tag once, landing on the wrong commit in
            # detached HEAD) -- this leaves no room for that.
            git fetch origin "refs/heads/persian-subs-$TAG:refs/remotes/origin/persian-subs-$TAG"
            git checkout -B "persian-subs-$TAG" "origin/persian-subs-$TAG"
          else
            git fetch --depth 1 upstream "refs/tags/$TAG:refs/tags/upstream-$TAG"
            git checkout -b "persian-subs-$TAG" "upstream-$TAG"
            # If this stops applying cleanly, upstream changed buildDataSourceFactory():
            # the workflow fails here on purpose rather than publish a broken build --
            # re-add the 3-line hook there by hand (see update-smarttube.sh's own comment),
            # push the fixed branch, then re-run this workflow (it will reuse that branch).
            git cherry-pick 16f849e
            git push origin "persian-subs-$TAG"
          fi
          git submodule update --init --recursive

      # The in-app update checker (common/.../AppUpdateChecker) compares versionCode, which
      # build.gradle otherwise leaves fixed at whatever upstream last committed (2380) -- every
      # one of our builds would look like the SAME version forever and the app would never
      # offer the update. Derive a real, increasing versionCode from the tag itself instead:
      # "32.68" -> 32068, "32.47s" -> 32047 (trailing letters stripped). Also set versionName to
      # the real tag so Settings > About shows something meaningful, not the upstream default.
      - name: Set versionCode/versionName from the tag
        if: steps.check.outputs.exists == 'false'
        id: ver
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          MAJOR="${TAG%%.*}"
          MINOR_RAW="${TAG#*.}"
          MINOR=$(echo "$MINOR_RAW" | grep -o '^[0-9]*')
          CODE=$((MAJOR * 1000 + MINOR))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" smarttubetv/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$TAG\"/" smarttubetv/build.gradle
          grep -E "versionCode|versionName" smarttubetv/build.gradle | head -2

      - name: Gradle build
        if: steps.check.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableDebug --no-daemon

      # Matches the format AppVersionChecker.java expects (see its class javadoc): a "package"
      # key with the APK url, plus one entry per version. "latest" release + a fixed filename
      # (update_urls.xml points at .../releases/latest/download/update.json) means the app
      # always resolves to whatever this step last published, no per-tag URL juggling needed.
      - name: Build the update.json manifest
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          CODE="${{ steps.ver.outputs.code }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/persian-subs-$TAG/SmartTube_stable_${TAG}_armeabi-v7a.apk"
          cat > update.json <<JSON
          {
            "package": { "downloadUrl": "$APK_URL" },
            "$TAG": {
              "versionCode": $CODE,
              "changelog": ["Upstream $TAG", "Persian subtitles translated server-side (not YouTube's own auto-translate)"]
            }
          }
          JSON
          cat update.json

      - name: Publish release with the APK + update manifest
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "persian-subs-${{ steps.upstream.outputs.tag }}"
          name: "SmartTube ${{ steps.upstream.outputs.tag }} + Persian subtitles"
          files: |
            smarttubetv/build/outputs/apk/ststable/debug/*.apk
            update.json
