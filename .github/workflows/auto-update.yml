name: Auto-update SmartTube (Persian subtitles patch)

# Find the latest yuliskov/SmartTube release, apply the Persian-subtitle patch + small fixes
# (patches/apply-patch.py), build, sign with the SAME key every time, and publish
# the APK + update.json as the "latest" GitHub Release -- the app's own updater (and
# deploy-to-attbox.ps1) pick it up from there.

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild+republish even if this tag was already released'
        type: boolean
        default: false
      fresh:
        description: 'Ignore an existing persian-subs-<tag> branch and rebuild it from upstream + patch'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Every build MUST be signed with the same key as the app already installed on the TV,
      # or Android refuses the update ("App not installed"). Without this, each CI run signed
      # with a brand-new random debug key. Fail loudly instead of publishing an uninstallable APK.
      - name: Require the signing key
        run: |
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::SIGNING_KEY secret is missing -- run setup-signing.ps1 once on the Windows PC"
            exit 1
          fi

      # The patch helpers live on master; keep a copy before switching to the release branch.
      - name: Keep patch helpers
        run: cp -r patches "$RUNNER_TEMP/patches"

      - name: Find latest upstream release
        id: upstream
        run: |
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          TAG=$(git ls-remote --tags --refs upstream \
                | sed 's#.*refs/tags/##' \
                | grep -E '^[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n \
                | tail -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest upstream release: $TAG"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" != "true" ] && gh release view "persian-subs-$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "persian-subs-$TAG already released -- nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the patched branch (reuse if it already exists, else create it)
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          FRESH="${{ github.event.inputs.fresh }}"
          git config user.email "actions@github.com"
          git config user.name "SmartTube auto-update"
          if [ "$FRESH" != "true" ] && git ls-remote --exit-code --heads origin "persian-subs-$TAG" >/dev/null 2>&1; then
            echo "persian-subs-$TAG already exists on origin (likely hand-resolved after a conflict) -- using it as-is"
            # explicit refs/heads fetch + checkout -B: a TAG with this same name exists too.
            git fetch origin "refs/heads/persian-subs-$TAG:refs/remotes/origin/persian-subs-$TAG"
            git checkout -B "persian-subs-$TAG" "origin/persian-subs-$TAG"
          else
            git fetch --depth 1 upstream "refs/tags/$TAG:refs/tags/upstream-$TAG"
            git checkout -B "persian-subs-$TAG" "upstream-$TAG"
            # Anchor-based, not a cherry-pick: survives upstream editing the lines around the hook.
            # Fails here on purpose (no release) if the Persian-subtitle hook can't be placed --
            # then add it by hand, push the branch, and re-run (it reuses that branch).
            python3 "$RUNNER_TEMP/patches/apply-patch.py"
            git add -A common
            git commit -m "Persian subtitles from our own server + track-restore fix, on top of $TAG"
            git push --force origin "refs/heads/persian-subs-$TAG:refs/heads/persian-subs-$TAG"
          fi
          git submodule update --init --recursive

      # Idempotent: on a reused/hand-fixed branch it only adds what's missing.
      - name: Apply patch (idempotent)
        if: steps.check.outputs.exists == 'false'
        run: python3 "$RUNNER_TEMP/patches/apply-patch.py"

      - name: Make sure the Persian-subtitle hook is in this build
        if: steps.check.outputs.exists == 'false'
        run: |
          test -f common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/other/TranslatingDataSource.java
          grep -q "TranslatingDataSource" common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/ExoMediaSourceFactory.java

      # A branch built straight from upstream ships upstream's update_urls.xml (checks
      # yuliskov/SmartTube and would lose this patch on the next in-app update). Overwrite it.
      - name: Point self-update at this fork
        if: steps.check.outputs.exists == 'false'
        run: |
          sed -i "s#<item>.*</item>#<item>https://github.com/${{ github.repository }}/releases/latest/download/update.json</item>#" common/src/ststable/res/values/update_urls.xml
          cat common/src/ststable/res/values/update_urls.xml

      # Real, increasing versionCode from the tag: "32.68" -> 32068 (always above upstream's own
      # ~2xxx codes, so it also updates over the hand-built 32.68.1 = 2459).
      - name: Set versionCode/versionName from the tag
        if: steps.check.outputs.exists == 'false'
        id: ver
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          MAJOR="${TAG%%.*}"
          MINOR_RAW="${TAG#*.}"
          MINOR=$(echo "$MINOR_RAW" | grep -o '^[0-9]*')
          CODE=$((MAJOR * 1000 + MINOR))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" smarttubetv/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$TAG\"/" smarttubetv/build.gradle
          grep -E "versionCode|versionName" smarttubetv/build.gradle | head -2

      # build.gradle signs debug builds with this keystore whenever keystore.properties exists.
      - name: Configure signing
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > "$RUNNER_TEMP/key.jks"
          {
            echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "storeFile=$RUNNER_TEMP/key.jks"
          } > keystore.properties

      - name: Gradle build
        if: steps.check.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableDebug --no-daemon

      # Last guard: the new APK must carry the signature of the SmartTube installed on the TV
      # (fingerprint read from the TV's own APK on 2026-10-24). Any other key = Android refuses the
      # update, so stop instead of publishing it.
      - name: Verify signature matches the TV's install
        if: steps.check.outputs.exists == 'false'
        env:
          EXPECTED_CERT: "7D:C0:6A:2A:53:12:DD:76:D0:9E:24:61:17:B2:CB:94:55:E6:48:E1:B1:96:3E:F7:9D:17:38:35:C0:11:79:25"
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          NEW_APK="smarttubetv/build/outputs/apk/ststable/debug/SmartTube_stable_${TAG}_armeabi-v7a.apk"
          ls -la smarttubetv/build/outputs/apk/ststable/debug/
          test -f "$NEW_APK"
          NEW=$(keytool -printcert -jarfile "$NEW_APK" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "new APK cert: $NEW"
          echo "TV cert:      $EXPECTED_CERT"
          if [ "$NEW" != "$EXPECTED_CERT" ]; then
            echo "::error::Signature differs from the TV's install -- the TV could not install this update"
            exit 1
          fi

      - name: Build the update.json manifest
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          CODE="${{ steps.ver.outputs.code }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/persian-subs-$TAG/SmartTube_stable_${TAG}_armeabi-v7a.apk"
          cat > update.json <<JSON
          {
            "package": { "downloadUrl": "$APK_URL" },
            "$TAG": {
              "versionCode": $CODE,
              "changelog": ["Upstream $TAG", "Persian subtitles translated server-side (not YouTube's own auto-translate)"]
            }
          }
          JSON
          cat update.json

      - name: Publish release with the APK + update manifest
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "persian-subs-${{ steps.upstream.outputs.tag }}"
          target_commitish: "persian-subs-${{ steps.upstream.outputs.tag }}"
          name: "SmartTube ${{ steps.upstream.outputs.tag }} + Persian subtitles"
          make_latest: true
          files: |
            smarttubetv/build/outputs/apk/ststable/debug/*.apk
            update.json
